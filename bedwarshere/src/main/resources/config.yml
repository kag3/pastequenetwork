# ============================================================
#  PastequeBedWars - Configuration principale
#  Hypixel-style BedWars pour Minecraft 1.9.4
# ============================================================

# Nom du serveur affiche dans le scoreboard
server-name: "pasteque.world"

# Monde du lobby BedWars (ou arrivent les joueurs apres le hub).
# Par defaut on REMPLACE le monde "world" par le lobby : le joueur apparait
# directement dans la bonne map, pas de teleport sale au join.
# Si tu veux un monde de lobby separe, change ceci en "bedwars_lobby".
lobby:
  world: "world"
  # Au PREMIER demarrage du plugin, si world == "world", le monde vanilla genere
  # par Spigot est supprime et remplace par un void + la schematic du lobby.
  # Operation faite UNE SEULE FOIS (marker .world-wiped). Mets a false si tu as
  # deja prepare le monde a la main.
  wipe-world-on-first-run: true
  # Si le dechargement de "world" echoue (certains hebergeurs), ce flag controle
  # le fallback de paste automatique du lobby sur le monde deja charge.
  # Desactive par defaut pour eviter les boots loops CPU sur grosses schematics.
  paste-on-unload-fail: false
  # Paste automatique du lobby au demarrage si .lobby-loaded absent.
  # Active par defaut avec un delai pour laisser le serveur finir son boot.
  auto-paste-on-startup: true
  # Delai (ticks) avant auto-paste du lobby (20 ticks = 1 sec)
  auto-paste-delay-ticks: 40
  spawn:
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  # Position des NPC de selection de mode
  npcs:
    solo:
      x: 5.5
      y: 100.0
      z: 0.5
      yaw: -90.0
      pitch: 0.0
      skin: "MHF_Steve"
    duo:
      x: 0.5
      y: 100.0
      z: 5.5
      yaw: 180.0
      pitch: 0.0
      skin: "MHF_Alex"
    teams:
      x: -5.5
      y: 100.0
      z: 0.5
      yaw: 90.0
      pitch: 0.0
      skin: "MHF_Herobrine"

# Configuration des modes de jeu
modes:
  solo:
    display-name: "&a&lSolo"
    icon: "IRON_SWORD"
    teams: 4
    players-per-team: 1
    min-players-to-start: 2
    lines:
      - "&7Mode 4x1"
      - "&7Chacun pour soi, 4 joueurs max"
  duo:
    display-name: "&b&lDuo"
    icon: "DIAMOND_SWORD"
    teams: 4
    players-per-team: 2
    min-players-to-start: 4
    lines:
      - "&7Mode 4x2"
      - "&7En equipe de 2, 8 joueurs max"
  teams:
    display-name: "&c&lTeams"
    icon: "DIAMOND_AXE"
    teams: 4
    players-per-team: 4
    min-players-to-start: 8
    lines:
      - "&7Mode 4x4"
      - "&7En equipe de 4, 16 joueurs max"

# Pool d'arenes : configuration du cycle des maps
arena:
  # Dossier des schematics (relatif au dossier du plugin)
  schematic-folder: "schematics"
  # Dossier d'exports des templates de mondes
  template-folder: "templates"
  # Delai en secondes de decompte du demarrage
  start-countdown: 20
  # Delai du countdown quand le min-players est atteint
  start-countdown-quick: 10
  # Delai de fin de partie avant teleport lobby
  end-delay: 10
  # Hauteur y du monde void (pour generer des worlds vides)
  void-height: 64
  # Distance entre deux arenes dans le meme monde (chunks)
  arena-spacing: 500

# Timeline des events (en secondes depuis le debut de la partie)
events:
  diamond-ii: 360      # 6 minutes
  emerald-ii: 480      # 8 minutes
  diamond-iii: 720     # 12 minutes
  emerald-iii: 840     # 14 minutes
  bed-destruction: 1200 # 20 minutes
  sudden-death: 1500   # 25 minutes
  game-end: 1800       # 30 minutes

# Configuration des generateurs par type
generators:
  iron:
    spawn-interval-ticks: 10   # 0.5s
    max-items-ground: 48
    drops:
      - "IRON_INGOT 1"
  gold:
    spawn-interval-ticks: 40   # 2s
    max-items-ground: 8
    drops:
      - "GOLD_INGOT 1"
  diamond:
    tiers:
      - interval-ticks: 600    # 30s
        display: "&bTier I"
      - interval-ticks: 400    # 20s
        display: "&bTier II"
      - interval-ticks: 200    # 10s
        display: "&bTier III"
    max-items-ground: 4
    drops:
      - "DIAMOND 1"
  emerald:
    tiers:
      - interval-ticks: 1300   # 65s
        display: "&aTier I"
      - interval-ticks: 800    # 40s
        display: "&aTier II"
      - interval-ticks: 400    # 20s
        display: "&aTier III"
    max-items-ground: 4
    drops:
      - "EMERALD 1"

