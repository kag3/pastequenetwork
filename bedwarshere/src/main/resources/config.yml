# Respawn et gameplay
gameplay:
  respawn-seconds: 5
  spawn-protection-seconds: 3
  bed-destroy-radius: 3
  void-death-y: 0
  # Distance a partir de laquelle un joueur est considere comme un campeur
  camper-warn-radius: 10

# Maps : definit quelles maps sont disponibles par mode.
# Deux formats sont supportes simultanement :
#
# 1) YAML explicite dans plugins/PastequeBedWars/maps/<id>.yml
#    (pour les maps schematic avec positions fixes)
#
# 2) Dossier de monde Minecraft auto-detecte :
#    Les dossiers nommes "mapbedwars", "mapbedwars2", ..., "mapbedwars5"
#    situes dans la racine du serveur (ou plugins/PastequeBedWars/maps-worlds/)
#    sont auto-enregistres. Leurs mecanismes (lits, generateurs, shops) sont
#    scannes automatiquement a partir des marqueurs (beds, blocs de diamant/emeraude,
#    etc.). Aucun /bwsetup manuel n'est necessaire.
#
# La liste ci-dessous est en fallback pour les maps YAML. Les maps auto-detectees
# sont utilisees par defaut pour tous les modes.
maps:
  solo: []
  duo: []
  teams: []

# Reglages de collage des schematics.
# Garder ignore-air-on-paste a true pour eviter les watchdog timeouts au boot
# sur les grosses maps/lobbys (moins de blocs modifies d'un coup).
schematics:
  ignore-air-on-paste: true
