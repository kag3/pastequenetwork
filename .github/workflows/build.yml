name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      
      - name: Build HUB
        run: cd hub-plugin && mvn clean package
      
      - name: Build BEDWARS
        run: cd bedwars-plugin && mvn clean package
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            hub-plugin/target/PastequeHub.jar
            bedwars-plugin/target/PastequeBedWars.jar
