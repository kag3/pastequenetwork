# ============================================================
#  PastequeBedWars - Shop villager (prix Hypixel-style)
# ============================================================
# Chaque item a:
#   material: nom Bukkit Material 1.9.4
#   amount: quantite achetee
#   cost: cout (IRON/GOLD/DIAMOND/EMERALD)
#   price: quantite requise
#   name: nom affiche
#   data: valeur de data (optionnel, pour wool/glass...)
#   enchants: liste optionnelle "ENCHANT:level"
#   lore: lore optionnel
#   permanent: true si l'item reste apres la mort

categories:
  blocks:
    icon: "WOOL"
    name: "&aBlocs"
    slot: 1
    items:
      - id: wool
        material: WOOL
        data: 0  # sera remplace par la couleur de l'equipe
        amount: 16
        cost: IRON
        price: 4
        name: "&fLaine"
        team-colored: true
      - id: hardened_clay
        material: STAINED_CLAY
        data: 0
        amount: 16
        cost: IRON
        price: 12
        name: "&6Terre cuite"
        team-colored: true
      - id: glass
        material: STAINED_GLASS
        data: 0
        amount: 4
        cost: IRON
        price: 12
        name: "&fVerre"
        team-colored: true
      - id: endstone
