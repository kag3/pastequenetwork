name: PastequeSkyblockAIO
version: 1.0.0
main: fr.pasteque.skyblock.PastequeSkyblockPlugin
author: PastequeNetwork
description: All-In-One Skyblock - Islands, Economy, Arena, Moderation, Shops
load: POSTWORLD

commands:
  is:
    description: Commandes d'ile skyblock
    aliases: [island]
  iscoop:
    description: Commandes d'ile cooperative
  money:
    description: Voir votre solde
    aliases: [balance, bal]
  pay:
    description: Envoyer de l'argent
  hdv:
    description: Hotel des ventes
  friends:
    description: Gestion des amis
  enemy:
    description: Gestion des ennemis
  alliance:
    description: Gestion des alliances
  pvpwarp:
    description: Teleportation zone PvP
  endevent:
    description: Evenement End Dragon
  aend:
    description: Admin End Event
  aevent:
    description: Admin multi-event system (meteor, koth, treasure)
  psky:
    description: Admin skyblock
  pg:
    description: Commandes de moderation PastequeGuard
  myshop:
    description: Gestion des boutiques personnelles
  myshopadmin:
    description: Administration des boutiques
  arena:
    description: Teleportation arene PvP
  arenakit:
    description: Boutique de kits arene
  arenalevel:
    description: Voir votre niveau d'arene
  arenaadmin:
    description: Administration de l'arene
  skills:
    description: Voir vos competences
    aliases: [competences, skill]
  combatpass:
    description: Passe de Combat
    aliases: [pass, bp]
  menu:
    description: Ouvrir le menu principal
    aliases: [mainmenu]
  isupgrade:
    description: Ameliorations d'ile
    aliases: [isup]
  iswarp:
    description: Warps d'ile
  collection:
    description: Collections de ressources
    aliases: [collections]
  pet:
    description: Animaux de compagnie
    aliases: [pets]
  darkauction:
    description: Enchere sombre
    aliases: [da]
  slayer:
    description: Slayers
    aliases: [slayers]
  staff:
    description: Mode staff
    aliases: [staffmode]
  duel:
    description: Defier un joueur en duel
    aliases: [duels]
  bounty:
    description: Primes sur joueurs
    aliases: [prime]
  elo:
    description: Classement ELO
    aliases: [rank, classement]
  koth:
    description: Rejoindre le KOTH en cours
  npc:
    description: Gestion des NPCs (admin)
  minions:
    description: Ouvrir la boutique de minions
    aliases: [minionshop]
  top:
    description: Classements (money/elo/ile) avec hologrammes
    aliases: [leaderboard, classements]
  dailychest:
    description: Donner un coffre de recompense quotidienne (admin)
    aliases: [dailyreward]

permissions:
  pastequeskyblock.admin:
    description: Acces aux commandes admin skyblock
    default: op
  pastequeguard.staff:
    description: Acces aux commandes de moderation
    default: op
  pastequeguard.bypass.chatfilter:
    description: Bypass le filtre anti-spam
    default: op
  pastequemylittleshop.admin:
    description: Administration des boutiques joueurs
    default: op
  pastequearena.admin:
    description: Administration de l'arene
    default: op
  pastequearena.bypass:
    description: Bypass les protections arene
    default: op
  pasteque.staff:
    description: Acces au mode staff
    default: op
