# ============================================
# PastequeSkyblock All-In-One Configuration
# ============================================

prefix: "&2Pasteque &5Skyblock &8» "

# --- Worlds ---
worlds:
  island-world: "pasteque_skyblock_islands"
  coop-world: "pasteque_skyblock_coop"
  end-world: "pasteque_skyblock_end"
  arena-world: "skyblockarena"
  island-y: 100
  coop-y: 100

# --- Islands ---
islands:
  size: 320
  gap: 340
  coop-base-size: 220
  coop-size-per-player: 30
  coop-gap: 520
  max-members: 10
  invite-timeout: 120

# --- Economy ---
economy:
  currency-name: "Pasteque"
  starting-balance: 250.0
  daily-reward: 150.0

# --- Auction House ---
auction:
  listing-fee: 25.0
  max-listings: 10
  expiration-days: 7
  page-size: 45

# --- PvP 1.8 Style (comme LabyRoyale) ---
old-pvp:
  enabled: true
  # Knockback horizontal de base
  base-knockback: 0.4
  # Knockback supplementaire en sprint
  sprint-knockback: 0.45
  # Knockback vertical (hauteur)
  vertical-knockback: 0.36
  # Multiplicateur par niveau d'enchantement Knockback
  knockback-enchant-multiplier: 0.5
  # Desactiver l'offhand (pas de bouclier, pas de dual-wield)
  disable-offhand: true
  # Desactiver le sweep attack (attaque balayage 1.9+)
  disable-sweep: true
  # Desactiver les boucliers (craft + utilisation)
  disable-shields: true

# --- Combat ---
combat:
  tag-seconds: 30
  logout-penalty: 500.0
  pvp-steal-percent: 0.10
  pvp-steal-cap: 250.0

# --- Invasions ---
invasions:
  interval-minutes: 20
  mob-count: 8
  kill-reward: 25.0
  chance: 0.5

# --- End Event ---
end-event:
  duration-minutes: 30
  dragon-health: 300
  hour: 20
  rewards:
    first: 100000.0
    second: 50000.0
    third: 25000.0
    fourth: 25000.0
    last-hit: 15000.0

# --- Challenges ---
challenges:
  list:
    woodcutter:
      display: "&eBucheron"
      material: LOG
      amount: 64
      reward: 500.0
    miner:
      display: "&7Mineur"
      material: COBBLESTONE
      amount: 128
      reward: 750.0

# --- Block Values (Island Level) ---
block-values:
  DIAMOND_BLOCK: 50
  EMERALD_BLOCK: 40
  GOLD_BLOCK: 30
  IRON_BLOCK: 20
  LAPIS_BLOCK: 15
  REDSTONE_BLOCK: 10
  COAL_BLOCK: 5
  OBSIDIAN: 5
  DIAMOND_ORE: 10
  EMERALD_ORE: 8
  GOLD_ORE: 6
  IRON_ORE: 4
  COAL_ORE: 2
  LOG: 1
  LOG_2: 1
  MELON_BLOCK: 1
  PUMPKIN: 1

# --- Border ---
border:
  particle-distance: 14
  refresh-ticks: 20
  cooldown-ms: 700

# --- Guard (Moderation) ---
guard:
  prefix: "&2Pasteque &5Guard &8» "
  filter:
    min-delay-ms: 1200
    repeat-threshold: 3
    caps-threshold: 0.72
    max-same-char-run: 12
    violation-reset-seconds: 25
    automute-duration: "10m"
    automute-violation-count: 4
  reports:
    gui-title: "&2Pasteque &5Guard &8- &dSignalements"
    gui-size: 54
    item-material: BOOK_AND_QUILL
    close-material: BARRIER

# --- Player Shops ---
playershop:
  look-distance: 6
  buy-amount: 1
  sign-title-color: "&2&l"

# --- Arena ---
arena:
  kit:
    price: 250.0
    description: "&7Kit de combat complet"
  level-formula:
    base: 75
    linear: 25
    quadratic: 5
  max-level: 101
  kill-xp: 35
  activity-xp-per-minute: 4
  combat-tag-seconds: 30
  combat-logout-penalty: 500.0
  pvp-pasteque-steal-percent: 0.10
  chat-format: "&8[&5Niv.%level%&8] &f%player% &8» &f%message%"

# --- Messages ---
messages:
  no-permission: "&cTu n'as pas la permission."
  player-only: "&cCommande reservee aux joueurs."
  player-not-found: "&cJoueur introuvable."
  island-created: "&aTon ile a ete generee avec succes !"
